spring.application.name=course-management-mvc
server.port=8080

# H2 in-memory database: zero setup, seeded on startup
spring.datasource.url=jdbc:h2:mem:coursedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf: templates are re-read without restart during development
spring.thymeleaf.cache=false
